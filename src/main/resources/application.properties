# ==============================================================================
# Automated Hostel Mess Meal Exemption and Billing System
# Application Configuration
# ==============================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=Automated Hostel Mess Meal Exemption and Billing System

# ==============================================================================
# Neon Cloud PostgreSQL Connectivity
# ==============================================================================
spring.datasource.url=jdbc:postgresql://ep-proud-unit-bdc2rh1f-pooler.c-8.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_pNCG0UuPe7RF
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings for Cloud Database
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000

# ==============================================================================
# Spring Data JPA & Hibernate Configuration
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.open-in-view=true

# ==============================================================================
# Thymeleaf Template Engine Configuration
# ==============================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# ==============================================================================
# Initial Administrator Account Configuration
# ==============================================================================
app.init.admin.username=admin
app.init.admin.password=Admin@123
app.init.admin.full-name=System Administrator

# ==============================================================================
# Mess Rebate & Monthly Billing Parameters
# ==============================================================================
app.billing.base-monthly-fee=3000.00
app.billing.rebate-per-meal=40.00

