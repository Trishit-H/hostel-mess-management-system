<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Access Denied', ~{::content})}">
<head>
    <title>Access Denied</title>
</head>
<body>
    <div th:fragment="content">
        <div class="row justify-content-center py-5">
            <div class="col-md-7 col-lg-6 text-center">
                <div class="card p-4 p-md-5 border">
                    <div class="mb-3">
                        <span style="font-size: 3rem;">🚫</span>
                    </div>
                    <h1 class="h3 mb-2 text-danger">403 - Access Denied</h1>
                    <p class="text-muted mb-4">
                        You do not have the required permissions to access this page.
                        Access to this section is strictly restricted by role-based security policies.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <span sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/admin/dashboard}" class="btn btn-primary">Go to Admin Dashboard</a>
                        </span>
                        <span sec:authorize="hasRole('STUDENT')">
                            <a th:href="@{/student/dashboard}" class="btn btn-primary">Go to Student Dashboard</a>
                        </span>
                        <span sec:authorize="hasRole('MESS_STAFF')">
                            <a th:href="@{/mess/dashboard}" class="btn btn-primary">Go to Mess Staff Dashboard</a>
                        </span>
                        <a th:href="@{/}" class="btn btn-outline-primary">Return Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
