<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Add Student', ~{::content})}">
<head>
    <title>Add Student</title>
</head>
<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                
                <div class="card border bg-white">
                    <div class="card-header bg-white py-3">
                        <h1 class="h5 mb-0 fw-bold">Enroll New Student Resident</h1>
                        <small class="text-muted">Create student account with credentials and room allotment.</small>
                    </div>
                    <div class="card-body p-4">
                        
                        <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small mb-3">
                            <span th:text="${errorMessage}">Error</span>
                        </div>

                        <form th:action="@{/admin/students/save}" method="post">
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" name="fullName" placeholder="e.g. Rahul Sharma" required autofocus>
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold small">Username / Roll Number <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="e.g. 2026mca045" required>
                                <div class="form-text small">Used by student to sign in. Must be unique.</div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold small">Initial Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter secure password" required>
                                <div class="form-text small">Will be encrypted using BCrypt hash in database.</div>
                            </div>

                            <div class="mb-4">
                                <label for="roomNo" class="form-label fw-semibold small">Hostel Room Number</label>
                                <input type="text" class="form-control" id="roomNo" name="roomNo" placeholder="e.g. B-204">
                            </div>

                            <div class="d-flex justify-content-between align-items-center">
                                <a th:href="@{/admin/students}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                                <button type="submit" class="btn btn-primary">Enroll Student</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
