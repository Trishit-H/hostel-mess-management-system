<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit Student', ~{::content})}">
<head>
    <title>Edit Student</title>
</head>
<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                
                <div class="card border bg-white">
                    <div class="card-header bg-white py-3">
                        <h1 class="h5 mb-0 fw-bold">Edit Student Details</h1>
                        <small class="text-muted">Update profile information and room allotment.</small>
                    </div>
                    <div class="card-body p-4">
                        
                        <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small mb-3">
                            <span th:text="${errorMessage}">Error</span>
                        </div>

                        <form th:action="@{'/admin/students/update/' + ${student.userId}}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-muted">Username / Roll No</label>
                                <input type="text" class="form-control bg-light" th:value="${student.username}" disabled readonly>
                                <div class="form-text small">Username cannot be altered after enrollment.</div>
                            </div>

                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" name="fullName" th:value="${student.fullName}" required>
                            </div>

                            <div class="mb-3">
                                <label for="roomNo" class="form-label fw-semibold small">Hostel Room Number</label>
                                <input type="text" class="form-control" id="roomNo" name="roomNo" th:value="${student.roomNo}">
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold small">New Password (Optional)</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Leave blank to keep existing password">
                                <div class="form-text small">Enter only if student requested a password reset.</div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center">
                                <a th:href="@{/admin/students}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
