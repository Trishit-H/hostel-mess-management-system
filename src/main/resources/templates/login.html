<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Login', ~{::content})}">
<head>
    <title>Login</title>
</head>
<body>
    <div th:fragment="content">
        <div class="row justify-content-center py-4">
            <div class="col-md-6 col-lg-5 col-xl-4">
                
                <!-- Login Card -->
                <div class="card border">
                    <div class="card-header text-center py-3 bg-white">
                        <span class="fs-4 d-block mb-1">🏛️</span>
                        <h2 class="h5 mb-1">System Login</h2>
                        <small class="text-muted">Hostel Mess Meal Exemption &amp; Billing</small>
                    </div>

                    <div class="card-body p-4">
                        
                        <!-- Error Alert -->
                        <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small mb-3" role="alert">
                            <strong>Login Failed:</strong> <span th:text="${errorMessage}">Error message</span>
                        </div>

                        <!-- Logout Success Alert -->
                        <div th:if="${logoutMessage}" class="alert alert-success py-2 px-3 small mb-3" role="alert">
                            <span th:text="${logoutMessage}">Logged out successfully.</span>
                        </div>

                        <!-- Login Form -->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold small">Username / Roll No.</label>
                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       name="username"
                                       placeholder="Enter your username"
                                       required
                                       autofocus>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold small">Password</label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       placeholder="Enter your password"
                                       required>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary">
                                    Sign In
                                </button>
                            </div>
                        </form>

                        <div class="text-center pt-2 border-top">
                            <a th:href="@{/}" class="text-decoration-none small text-muted">&larr; Back to Home</a>
                        </div>
                    </div>
                </div>

                <!-- Testing Hint Panel for Viva / Development -->
                <div class="card border bg-light mt-3">
                    <div class="card-body p-3">
                        <small class="fw-bold d-block text-muted mb-2 text-uppercase" style="font-size: 0.72rem;">
                            Default Initial Accounts for Evaluation:
                        </small>
                        <table class="table table-sm table-borderless small mb-0" style="font-size: 0.8rem;">
                            <tbody>
                                <tr>
                                    <td class="fw-semibold text-primary">ADMIN:</td>
                                    <td><code>admin</code></td>
                                    <td><code>Admin@123</code></td>
                                </tr>
                                <tr>
                                    <td class="fw-semibold text-success">STUDENT:</td>
                                    <td><code>student1</code></td>
                                    <td><code>Student@123</code></td>
                                </tr>
                                <tr>
                                    <td class="fw-semibold text-dark">MESS_STAFF:</td>
                                    <td><code>staff1</code></td>
                                    <td><code>Staff@123</code></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
