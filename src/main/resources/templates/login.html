<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Login', ~{::content})}">
<head>
    <title>Login</title>
</head>
<body>
    <div th:fragment="content">
        <div class="row justify-content-center py-4">
            <div class="col-md-6 col-lg-5 col-xl-4">
                
                <!-- Login Card -->
                <div class="card border shadow-sm">
                    <div class="card-header text-center py-3 bg-white">
                        <span class="fs-4 d-block mb-1">🏛️</span>
                        <h2 class="h5 mb-1">System Login</h2>
                        <small class="text-muted">Hostel Mess Meal Exemption &amp; Billing</small>
                    </div>

                    <div class="card-body p-4">
                        
                        <!-- Error Alert -->
                        <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small mb-3" role="alert">
                            <strong>Login Failed:</strong> <span th:text="${errorMessage}">Error message</span>
                        </div>

                        <!-- Logout Success Alert -->
                        <div th:if="${logoutMessage}" class="alert alert-success py-2 px-3 small mb-3" role="alert">
                            <span th:text="${logoutMessage}">Logged out successfully.</span>
                        </div>

                        <!-- Login Form -->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold small">Username / Roll No.</label>
                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       name="username"
                                       placeholder="Enter your username"
                                       required
                                       autofocus>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold small">Password</label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       placeholder="Enter your password"
                                       required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Sign In
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Demo Credentials Card -->
                <div class="card border bg-light mt-3 shadow-sm">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom">
                            <span class="fw-bold small text-dark text-uppercase" style="font-size: 0.75rem;">Demo Credentials</span>
                            <span class="text-muted" style="font-size: 0.7rem;">Click &ldquo;Fill&rdquo; to auto-enter</span>
                        </div>
                        <div class="list-group list-group-flush small">
                            <div class="list-group-item bg-transparent px-0 py-2 d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge bg-danger me-1">ADMIN</span>
                                    <code>admin</code> / <code>Admin@123</code>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size: 0.75rem;"
                                        onclick="fillCredentials('admin', 'Admin@123')">
                                    Fill
                                </button>
                            </div>
                            <div class="list-group-item bg-transparent px-0 py-2 d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge bg-primary me-1">STUDENT</span>
                                    <code>student1</code> / <code>Student@123</code>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size: 0.75rem;"
                                        onclick="fillCredentials('student1', 'Student@123')">
                                    Fill
                                </button>
                            </div>
                            <div class="list-group-item bg-transparent px-0 py-2 d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge bg-secondary me-1">MESS_STAFF</span>
                                    <code>staff1</code> / <code>Staff@123</code>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size: 0.75rem;"
                                        onclick="fillCredentials('staff1', 'Staff@123')">
                                    Fill
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <script>
                    function fillCredentials(user, pass) {
                        var u = document.getElementById('username');
                        var p = document.getElementById('password');
                        if (u && p) {
                            u.value = user;
                            p.value = pass;
                            u.focus();
                        }
                    }
                </script>

            </div>
        </div>
    </div>
</body>
</html>
