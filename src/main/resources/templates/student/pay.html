<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pay Bill</title>
</head>
<body>
<div th:fragment="content">
    <h2 th:text="'Pay Bill for ' + ${bill.billingMonth}">Pay Bill</h2>
    <div class="card border bg-white mb-4">
        <div class="card-body p-3">
            <p><strong>Base Fee:</strong> &#8377;<span th:text="${bill.baseFee}">0.00</span></p>
            <p><strong>Approved Meals:</strong> <span th:text="${bill.eligibleRebateUnits}">0</span> meals</p>
            <p><strong>Rebate Deduction:</strong> -&#8377;<span th:text="${bill.deductionAmount}">0.00</span></p>
            <p><strong>Net Payable:</strong> &#8377;<span th:text="${bill.netAmount}">0.00</span></p>
        </div>
    </div>
    <form th:action="@{'/student/pay/' + ${bill.billId} + '/confirm'}" method="post">
        <button type="submit" class="btn btn-success">Mark as PAID</button>
        <a th:href="@{/student/dashboard}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
</body>
</html>
